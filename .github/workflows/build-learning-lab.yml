name: Build Learning Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'fabric-learning-lab.zip'
      - '.github/workflows/build-learning-lab.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip -q fabric-learning-lab.zip -d project
          BUILD_FILE=$(find project -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build mod
        run: gradle build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Learning-Lab
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar

