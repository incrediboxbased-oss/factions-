
name: Build Learning Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'fabric-learning-lab.zip'
      - '.github/workflows/build-learning-lab.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          unzip -q fabric-learning-lab.zip -d project

          BUILD_FILE=$(find project -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check source files
        run: |
          echo "Java source files:"
          find "$PROJECT_DIR/src/main/java" -type f -name "*.java"

          if ! find "$PROJECT_DIR/src/main/java" -type f -name "*.java" | grep -q .; then
            echo "ERROR: No Java source files found"
            exit 1
          fi

      - name: Build mod
        run: gradle build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Inspect compiled classes
        run: |
          echo "Compiled classes:"
          find "$PROJECT_DIR/build/classes/java/main" -type f -name "*.class" || true

          echo "JAR files:"
          find "$PROJECT_DIR/build/libs" -type f -name "*.jar" -exec ls -lh {} \;

      - name: Verify JAR
        run: |
          JAR_FILE=$(find "$PROJECT_DIR/build/libs" -type f -name "*.jar" ! -name "*sources*" -print -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: JAR not found"
            exit 1
          fi

          echo "Checking: $JAR_FILE"
          unzip -l "$JAR_FILE"

          if ! unzip -l "$JAR_FILE" | grep -q '\.class'; then
            echo "ERROR: JAR contains no compiled classes"
            exit 1
          fi

          if ! unzip -l "$JAR_FILE" | grep -q 'fabric.mod.json'; then
            echo "ERROR: fabric.mod.json missing"
            exit 1
          fi

          echo "JAR verification successful"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Learning-Lab
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar


